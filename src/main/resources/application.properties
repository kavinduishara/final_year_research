meta.db.url=jdbc:postgresql://localhost:5432/public
meta.db.user=postgres
meta.db.pass=0000
meta.db.schema=public

worker.db.urls=jdbc:postgresql://localhost:5434/w1,jdbc:postgresql://localhost:5435/w2
# worker.db.urls=jdbc:postgresql://10.128.0.3:5432/w1,jdbc:postgresql://10.128.0.4:5432/w2
worker.db.user=postgres
worker.db.pass=0000

worker1.tables=customer,orders
worker2.tables=lineitem

shipping.enabled=true
shipping.skip.if.present=true

# Reset data placement between queries (drops shipped copies + inter_* tables)
research.cleanup.between.queries=true
research.cleanup.after.execution=true

# benchmark.baseline modes:
#   weighted-ship     = under-weights shipping (default)
#   static-qos        = min full estimated transfer
#   pessimistic-qos   = over-estimates intermediate rows at shallow cuts
#   calcite-cost      = Calcite planner cost only
#   combined-estimate = calcite cost + weighted transfer
#   deep-join         = deepest join (ablation only)
benchmark.baseline=weighted-ship
benchmark.baseline.ship.weight=0.02
benchmark.baseline.pessimism.factor=4.5
benchmark.baseline.transfer.weight=1.0

# train = one query (--sql / --file / default Q1)
# workload-train = all 10 ResearchQueryWorkload queries
# inference = load bandit.json, pick best cut, run once
# benchmark = 10-query benchmark (baseline vs LinUCB)
# training.mode=inference
# training.mode=workload-train
# training.mode=training
training.mode=benchmark
training.episodes=5

learning.bandit.path=bandit.json
learning.bandit.alpha=0.5
learning.bandit.ridge=1.0
learning.bandit.min.observations=1
# training.bandit.resume=true   continue updating existing bandit.json
training.bandit.resume=false
